data:
  data_path: 'data/imagenet1k-vavae/train_256' # generated by extract_features.py
  vae_model_name: 'vavae_f16d32'
  latent_size: 16
  num_classes: 1000
  latent_norm: true

model:
  model_type: LightningDiT-XL/1
  use_qknorm: true
  in_chans: 32

train:
  global_batch_size: 960 # slightly reduced from 1024 for 6x4090 GPU
  use_checkpoint: true
  n_epoch: 100
  save_every: 10
  ema: 0.9999
  use_lognorm: true

optimizer:
  lr: 0.0002
  weight_decay: 0
  beta1: 0.9
  beta2: 0.95

load_epoch: -1
save_dir: './output/imagenet1k/XLconditional'

sample:
  sampling_method: euler
  num_sampling_steps: 250
  timestep_shift: 0.3

  cfg_scale: 1.4
  cfg_interval_start: 0.11

  local_batch_size: 32
  fid_num: 10000 # warning: FID_10k for efficiency. Standard practice is FID_50k !

linear:
  valid_data_path: 'data/imagenet1k-vavae/valid_256' # generated by extract_features.py
  cls_num_classes: 1000
  n_epoch: 30
  global_batch_size: 1080 # slightly reduced from 1440 for 6x4090 GPU
  lr: 7.5e-4
  timestep: 0.75
  blockname: 'out_10'
  use_BN: true
