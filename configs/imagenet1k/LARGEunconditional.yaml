data:
  data_path: 'data/imagenet1k-vavae/train_256' # generated by extract_features.py
  vae_model_name: 'vavae_f16d32'
  latent_size: 16
  num_classes: -1
  latent_norm: true

model:
  model_type: LightningDiT-L/1
  use_qknorm: true
  in_chans: 32

train:
  global_batch_size: 1024
  use_checkpoint: true
  n_epoch: 400
  save_every: 10
  ema: 0.9999
  use_lognorm: true

optimizer:
  lr: 0.0002
  weight_decay: 0
  beta1: 0.9
  beta2: 0.95

load_epoch: -1
save_dir: './output/imagenet1k/LARGEunconditional'

sample:
  sampling_method: euler
  num_sampling_steps: 250
  timestep_shift: 0.3

  local_batch_size: 32
  fid_num: 10000 # warning: FID_10k for efficiency. Standard practice is FID_50k !

linear:
  valid_data_path: 'data/imagenet1k-vavae/valid_256' # generated by extract_features.py
  cls_num_classes: 1000
  n_epoch: 30
  global_batch_size: 1440
  lr: 1.0e-3
  timestep: 0.75
  blockname: 'out_16'
  use_BN: true


# Toggle the following settings for ADE20K / VOC2012 segmentation

seg:
  train_data_path: 'data/ade20k-vavae/train_256' # generated by seg_extract_features.py
  valid_data_path: 'data/ade20k-vavae/valid_256'
  seg_num_classes: 150
  interp_size: 256
  n_epoch: 30
  global_batch_size: 128
  lr: 3.0e-3
  timestep: 0.75
  blockname: 'out_9_11_13_15'
  use_LN: true

