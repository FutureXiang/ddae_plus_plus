data:
  data_path: 'data/imagenet1k-vavae/train_256' # generated by extract_features.py
  vae_model_name: 'vavae_f16d32'
  latent_size: 16
  num_classes: 1000
  latent_norm: true

model:
  model_type: LightningDiT-B/1
  use_qknorm: true
  in_chans: 32
  btnk_blockname: 'out_9'

train:
  global_batch_size: 1024
  use_checkpoint: false
  n_epoch: 100
  save_every: 10
  ema: 0.9999
  use_lognorm: true

optimizer:
  lr: 0.0002
  weight_decay: 0
  beta1: 0.9
  beta2: 0.95

load_epoch: -1
save_dir: './output/imagenet1k/BASEconditional_selfcond9'

sample:
  sampling_method: euler
  num_sampling_steps: 250
  timestep_shift: 0.3

  cfg_scale: 2.0
  cfg_interval_start: 0.11

  local_batch_size: 32
  fid_num: 10000 # warning: FID_10k for efficiency. Standard practice is FID_50k !

linear:
  valid_data_path: 'data/imagenet1k-vavae/valid_256' # generated by extract_features.py
  cls_num_classes: 1000
  n_epoch: 30
  global_batch_size: 1440
  lr: 2.0e-3
  timestep: 0.75
  blockname: 'out_6' # out_9 -> out_7 -> out_6 as training proceeds
  use_BN: true
